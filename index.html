<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jQuery Pokédex</title>

  <!-- Plug-in styles (Magnific Popup + Toastr) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/magnific-popup.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>jQuery <span>Pokédex</span></h1>
    <p>Data from the <a href="https://pokeapi.co" target="_blank">PokéAPI</a> web service</p>
  </header>

  <!-- Controls: search, type filter chips, favorites -->
  <section class="controls">
    <input id="search" type="search" placeholder="Search by name…" autocomplete="off">
    <button id="favs-btn" class="chip">♥ Favorites</button>
    <div id="types"></div>
  </section>

  <p id="status"></p>
  <main id="grid"></main>
  <button id="more" class="chip">Load more</button>

  <!-- Libraries: jQuery + 3 plug-ins + our own plug-in -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/jquery.magnific-popup.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.lazy/1.7.11/jquery.lazy.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
